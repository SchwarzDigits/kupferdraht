# Kupferdraht — ORT repository configuration for the Schwarz Digits
# compliance workflow (SchwarzDigits/oss-compliance). The central
# excludes are repeated here, as natrium does, and the repository adds
# the three files that reproduce third-party license texts: scanned as
# source they would attribute every license of the dependency graph to
# Kupferdraht itself.

excludes:
  paths:
    - pattern: "**/_benchmark/**"
      reason: "TEST_OF"
      comment: "Benchmark code, not part of the production build."
    - pattern: "**/_examples/**"
      reason: "EXAMPLE_OF"
      comment: "Example code, not part of the production build."
    - pattern: "**/_test/**"
      reason: "TEST_OF"
      comment: "Test code, not part of the production build."
    - pattern: "**/testdata/**"
      reason: "TEST_OF"
      comment: "Test fixtures, not part of the production build."
    - pattern: "**/fixtures/**"
      reason: "TEST_OF"
      comment: "Test fixtures, not part of the production build."
    - pattern: "**/node_modules/**"
      reason: "BUILD_TOOL_OF"
      comment: "Vendored npm packages, will be re-resolved by the package manager."
    - pattern: "docs/THIRD_PARTY_LICENSES.html"
      reason: "DOCUMENTATION_OF"
      comment: |
        The third-party license report generated by cargo-about. It
        reproduces the license text of every crate in the dependency
        graph; scanned as source it would attribute all of them to
        Kupferdraht. The authoritative statement of what Kupferdraht
        depends on is the Cargo graph, not this file.
    - pattern: "THIRD-PARTY-NOTICES"
      reason: "DOCUMENTATION_OF"
      comment: |
        The attribution file: license names and holders of every
        component, including the vendored and build-time ones.
        Documentation, not code.
    - pattern: "about.hbs"
      reason: "DOCUMENTATION_OF"
      comment: |
        The template of the license report; it carries the hand-kept
        section naming the licenses of the vendored components.
    - pattern: "bindings/swift/Package.swift"
      reason: "OTHER"
      comment: |
        The Swift package declares one local binary target, the
        kupferdrahtFFI.xcframework that build-xcframework.sh produces, and
        no third-party package. SwiftPM cannot load the manifest without
        that build product, so there is nothing for the analyzer to
        resolve.
    - pattern: "bindings/android/**"
      reason: "OTHER"
      comment: |
        The Android library build needs the Android SDK and the prebuilt
        native library, neither of which the ORT container has. Its
        third-party dependencies are the same Maven artifacts as the JVM
        build's (bindings/kotlin, analyzed) and are listed in
        THIRD-PARTY-NOTICES.
    - pattern: "bindings/kmp/**"
      reason: "OTHER"
      comment: |
        The Kotlin Multiplatform build drives cargo through the gobley
        plugins at configuration time and needs the Android SDK; the ORT
        container offers neither (its rustup directory is read-only). Its
        third-party dependencies are listed in THIRD-PARTY-NOTICES.
    - pattern: "vendor/libsqlite3-sys/**"
      reason: "OTHER"
      comment: |
        The libsqlite3-sys stand-in is reached through the root workspace's
        [patch] and is resolved, with its license and its one build
        dependency, as part of the root Cargo graph. Analyzed on its own
        manifest, ORT's Cargo plugin fails on the wasm32-only dependencies
        the stand-in declares (`js-sys … is missing in the map`), and the
        standalone result would only duplicate the root graph.
    - pattern: "bindings/kotlin/**"
      reason: "OTHER"
      comment: |
        The JVM binding build resolves no plugin inside the ORT container
        (`org.jetbrains.kotlin.jvm … was not found`); the Gradle Inspector
        fails the same way in natrium's compliance runs. Its three Maven
        dependencies are listed by hand in THIRD-PARTY-NOTICES.
