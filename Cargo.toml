[workspace]
resolver = "3"
members = ["kupferdraht-core", "kupferdraht-cli", "kupferdraht-uniffi-bindgen"]
# The vendored libsqlite3-sys stand-in is reached through the [patch]
# below, not as a member; excluding it lets `cargo metadata` run on its
# own manifest (the compliance scanner does) instead of failing with
# "current package believes it's in a workspace when it's not".
exclude = ["vendor/libsqlite3-sys"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Kupferdraht's own code is GPL-3.0-only (ADR-0016) — a free strategic
# choice, not one forced by the dependency tree: the graph must stay
# all-permissive (`deny.toml` blocks any copyleft pull), so Kupferdraht
# remains the only copyleft component in the combined work. The
# workspace crates are `publish = false` and excluded from the deny
# check via `private.ignore`.
license = "GPL-3.0-only"

# Step 90 (ADR-0021): route `libsqlite3-sys` to the vendored stand-in so
# rusqlite's `bundled` feature — forced workspace-wide by
# openmls_sqlite_storage 0.3 — compiles the SQLite3MC amalgamation
# (`vendor/sqlite3mc/`, pinned by PROVENANCE.txt) for kupferdraht.db, mls.db and
# global.db alike. Deterministic and probe-free; see vendor/README.md for why
# libsqlite3-sys's non-bundled `SQLITE3_LIB_DIR` route is not an option.
[patch.crates-io]
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }

# Step 112: Argon2id runs with 64 MiB; unoptimised it takes many seconds,
# and the tests run the real parameters.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
