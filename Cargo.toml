[workspace]
resolver = "3"
members = ["kupferdraht-core", "kupferdraht-cli", "kupferdraht-uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Kupferdraht's own code is GPL-3.0-only (ADR-0016) — a free strategic
# choice, not one forced by the dependency tree: the graph must stay
# all-permissive (`deny.toml` blocks any copyleft pull), so Kupferdraht
# remains the only copyleft component in the combined work. The
# workspace crates are `publish = false` and excluded from the deny
# check via `private.ignore`.
license = "GPL-3.0-only"

# Step 112: Argon2id runs with 64 MiB; unoptimised it takes many seconds,
# and the tests run the real parameters.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
