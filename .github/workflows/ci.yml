name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily for the advisories (Step 148): only the `audit` job runs on the
  # schedule.
  schedule:
    - cron: "23 5 * * *"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Debug info dominates the target-dir size and nobody attaches a
  # debugger to CI — dropping it keeps the 14 GB hosted runner from
  # filling up (the 2026-07-19 "No space left on device" failure).
  # The test profile inherits from dev.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    name: fmt + clippy + test
    # Step 158 measurement branch: only the tab scenarios run.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      # dtolnay/rust-toolchain@master needs the toolchain named: read the
      # channel from rust-toolchain.toml, the one place it is pinned.
      - name: Pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      # The hosted image ships ~15 GB of toolchains this job never
      # touches; plain `rm` instead of a third-party action keeps the
      # supply chain flat.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The Step 90 provenance pin reads the resolved fork checkout through
      # `cargo metadata --offline`, which needs every package of Cargo.lock
      # in the local registry — including the ones no target builds here
      # (the lockfile is the maximal resolve). A build fetches only what it
      # compiles; `cargo fetch` without `--target` fetches them all.
      - name: cargo fetch
        run: cargo fetch --locked

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The full suite runs here only (CLAUDE.md phase 8): `--no-fail-fast`
      # shows every red binary at once, and the doctests, which
      # `--all-targets` leaves out, run in their own step.
      - name: cargo test
        run: cargo test --workspace --all-targets --no-fail-fast

      - name: cargo test (doctests)
        run: cargo test --workspace --doc

  wasm:
    # Step 91 (ADR-0022, W2): the browser target compiles and its storage
    # pins run for real. Compile check first — gap-B.28 (a non-exhaustive
    # match) was red for weeks because nothing here built wasm32 — then
    # the wasm-bindgen tests in headless Firefox (OPFS needs a real
    # browser; Node has none). The SQLite3MC C is compiled for wasm by
    # `cc`, so the job needs a wasm-capable clang (the runner's clang has
    # the WebAssembly backend). Firefox + geckodriver ship on the hosted
    # image; scripts/wasm-test.sh drives wasm-bindgen-test-runner per
    # test file (the crate's unit-test harness is native-only).
    name: wasm32 check + browser tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      # dtolnay/rust-toolchain@master needs the toolchain named: read the
      # channel from rust-toolchain.toml, the one place it is pinned.
      - name: Pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32

      # `cc` compiles the SQLite3MC C with clang and archives it with
      # llvm-ar; rustc links wasm32 with its own rust-lld. The runner
      # image ships a versioned LLVM (`clang-NN`, `llvm-ar-NN`), and the
      # `clang`/`llvm` packages only add the unversioned names, so the
      # newest versioned pair that targets wasm32 is taken as it is. apt,
      # with retries, is the fallback for an image without one: two runs
      # failed on the runner's DNS fetching those 15 kB of names alone.
      # An unversioned clang pairs with `llvm-ar`, else the newest
      # `llvm-ar-NN` (a run once failed on "failed to find tool llvm-ar").
      - name: wasm-capable C toolchain
        run: |
          pick_toolchain() {
            for cc in $(ls /usr/bin/clang-[0-9]* 2>/dev/null | grep -E '/clang-[0-9]+$' | sort -V -r) clang; do
              command -v "$cc" > /dev/null || continue
              targets="$("$cc" --print-targets 2> /dev/null)" || continue
              case "$targets" in *wasm32*) ;; *) continue ;; esac
              case "$cc" in
                */clang-*) ar_bin="/usr/bin/llvm-ar-${cc##*-}" ;;
                *) ar_bin="$(command -v llvm-ar || ls /usr/bin/llvm-ar-* 2> /dev/null | sort -V | tail -1)" ;;
              esac
              [ -x "$ar_bin" ] || continue
              echo "using $cc and $ar_bin"
              echo "CC_wasm32_unknown_unknown=$cc" >> "$GITHUB_ENV"
              echo "AR_wasm32_unknown_unknown=$ar_bin" >> "$GITHUB_ENV"
              return 0
            done
            return 1
          }
          pick_toolchain || {
            sudo apt-get -o Acquire::Retries=5 update
            sudo apt-get -o Acquire::Retries=5 install -y clang llvm
            pick_toolchain
          }

      - name: cargo check (wasm32)
        run: cargo check -p kupferdraht-core --target wasm32-unknown-unknown

      # The runner must match the lockfile's wasm-bindgen exactly.
      - name: Install wasm-bindgen-test-runner
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/{getline; sub(/version = "/, ""); sub(/"/, ""); print; exit}' Cargo.lock)"
          cargo install --locked wasm-bindgen-cli --version "$version"

      # Step 158 measurement branch, never merged: the tab scenarios 60 times,
      # each timeout naming the waiting tab's state, the lease and the sightings.
      - name: step_94_leader_tab, 60 runs
        timeout-minutes: 40
        run: |
          export CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER="$(command -v wasm-bindgen-test-runner)"
          export WASM_BINDGEN_TEST_ONLY_WEB=1
          export GECKODRIVER="$(command -v geckodriver)"
          fails=0
          for i in $(seq 1 60); do
            if cargo test -p kupferdraht-core --target wasm32-unknown-unknown --test step_94_leader_tab > run.log 2>&1; then
              echo "run $i ok: $(grep -E '^test result' run.log | tail -1)"
            else
              fails=$((fails + 1))
              echo "run $i FAILED"
              grep -E 'FAIL|timeout waiting|Failed to detect|Invoking test|test result' run.log | cut -c1-4000
            fi
          done
          echo "runs=60 failed=$fails"

  audit:
    # Same tool and policy as the local pre-commit gate (CLAUDE.md
    # phase 8): deny.toml carries the curated, signed-off advisory
    # ignores. cargo-audit scanned the raw lockfile (flagging crates
    # no target compiles) and was muted with continue-on-error —
    # which would also have swallowed a real advisory in shipped
    # code. This job fails the build like the local gate does. It also
    # runs daily: the RustSec database changes between pull requests,
    # and Dependabot alerts only on the advisories GitHub carries too.
    name: cargo deny
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # dtolnay/rust-toolchain@master needs the toolchain named: read the
      # channel from rust-toolchain.toml, the one place it is pinned.
      - name: Pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: cargo deny check
        run: cargo deny check
