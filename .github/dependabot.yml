# Weekly update pull requests (Step 148); a maintainer reviews and merges
# them.
#
# cargo: every update Cargo.lock can take within the manifests'
# requirements, transitive crates included, in one pull request — what
# `cargo update` does. A fix for an advisory that reaches neither RustSec
# nor GitHub's reviewed database arrives this way too. A release that
# needs a manifest change is left to a step. The cooldown keeps a release
# out of the pull request until it is seven days old.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: lockfile-only
    allow:
      - dependency-type: all
    cooldown:
      default-days: 7
    groups:
      lockfile:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
